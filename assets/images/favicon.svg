<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#960c22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Viền ngoài vàng kim hoàng gia -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#d4af37" filter="url(#shadow)"/>
  <!-- Nền đỏ son Á Đông -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="url(#sealGrad)"/>
  <!-- Viền kẻ bên trong -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Chữ Hán "华" (Hoa) -->
  <text x="32" y="44" font-family="'Noto Serif SC', 'SimSun', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">华</text>
</svg>
